}

function estimateUnitTypes(units) {
  if (units < 18) return 1;
  if (units <= 60) return 2;
  return 3;
}

    ],
  },
];
const TOTAL_DELIVERABLES = PHASES.reduce((n, ph) => n + ph.steps.length, 0);

function money(n) {
  if (!isFinite(n) || n <= 0) return "—";
  // Rounds UP (never understates) to 2 significant figures, so every dollar figure reads as
  // a clean number instead of an oddly precise one — $647,000 becomes $650K, not "$647K".
  // A fixed increment (e.g. nearest $10K) can't do this across the whole range: it's right
  // for $647K but way overshoots a $11K figure into $20K. Scaling the increment to the
  // number's own magnitude (nearest $1K for $11K, nearest $10K for $647K) keeps both clean.
  const r = n >= 1000
    ? (() => { const mag = Math.pow(10, Math.floor(Math.log10(n)) - 1); return Math.ceil(n / mag) * mag; })()
    : Math.ceil(n);
  if (r >= 1_000_000) {
    const m = r / 1_000_000;
    return "$" + (Number.isInteger(m) ? m : m.toFixed(1)) + "M";
  }
  if (r >= 1_000) return "$" + Math.round(r / 1000) + "K";
  return "$" + r.toLocaleString();
}
function monthsUntil(dateStr) {
  if (!dateStr) return 0;
  const now = new Date();
  // Built from numeric y/m parts (not `new Date(dateStr + "-01")`) — a date-only ISO
  // string parses as UTC midnight, which in any timezone behind UTC (all of North
  // America) lands on the *previous* local day. Near a month boundary that silently
  // shifts the target back a whole calendar month (Sept 1 UTC reads as Aug 31 local).
  const [y, mo] = dateStr.split("-").map(Number);
  const target = new Date(y, mo - 1, 1);
  // Day-based instead of a flat calendar-month subtraction, rounded to the nearest
  // half month: a mid-August fill for a September opening is genuinely ~2 weeks out,
  // not a clean 0 or 1 — rounding to whole months either overstates the runway or,
  // right at a month boundary, flags a still-upcoming opening as already passed.
  const days = (target - now) / 86400000;
  // Signed — callers derive both "runway left" (positive) and "time since opening"
  // (negative) from the same number, instead of clamping the sign away here.
  return Math.round((days / 30.44) * 2) / 2;
}

// Loads an image and crops it to targetW x targetH (like CSS object-fit: cover),
// returning a JPEG data URL usable with jsPDF's addImage. focusY (0-1) biases the crop
// vertically — 0.5 is centered, higher values keep more of the bottom of the image
// (useful for building renders where the entrance/signage sits low in the frame).
// Loads a PNG as-is (no crop, no JPEG re-encode) so transparency survives — used for
// the logo mark, unlike loadCoverImage's object-fit:cover crop meant for photo banners.
// Downscaled to maxDim first: the source is print-res but only ever rendered at icon
// size in the PDF, and canvas's PNG re-encode is uncompressed enough that skipping
// this bloated a 145KB PDF to nearly 500KB for an 18pt-tall mark.
function loadPngImage(src, maxDim) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = maxDim ? Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight)) : 1;
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/png"));
    };
    img.onerror = reject;
    img.src = src;
  });
}
function loadCoverImage(src, targetW, targetH, focusY) {
  focusY = focusY === undefined ? 0.5 : focusY;
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.max(targetW / img.naturalWidth, targetH / img.naturalHeight);
      const sw = targetW / scale, sh = targetH / scale;
      const sx = (img.naturalWidth - sw) / 2, sy = (img.naturalHeight - sh) * focusY;
      const canvas = document.createElement("canvas");
      canvas.width = targetW; canvas.height = targetH;
      canvas.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, targetW, targetH);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = reject;
    img.src = src;
  });
}

// Fetches the actual Poppins TTF (same font used on-page throughout, matching
// acquisition.com's brand) and registers it with a jsPDF doc instance in both
// regular and bold weights, so the whole PDF matches the site's font instead of
// falling back to jsPDF's built-in Helvetica/Times. Cached across calls in-session.
const POPPINS_TTF = {
  normal: "https://fonts.gstatic.com/s/poppins/v24/pxiEyp8kv8JHgFVrFJA.ttf",
  bold: "https://fonts.gstatic.com/s/poppins/v24/pxiByp8kv8JHgFVrLCz7V1s.ttf",
};
const poppinsFontCache = {};
async function fetchAsBase64(url) {
  const res = await fetch(url);
  const bytes = new Uint8Array(await res.arrayBuffer());
  let binary = "";
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
async function ensurePoppinsFont(doc) {
  for (const style of ["normal", "bold"]) {
    if (!poppinsFontCache[style]) poppinsFontCache[style] = await fetchAsBase64(POPPINS_TTF[style]);
    doc.addFileToVFS(`Poppins-${style}.ttf`, poppinsFontCache[style]);
    doc.addFont(`Poppins-${style}.ttf`, "Poppins", style);
  }
}

function App() {
  const [step, setStep] = useState(0); // 0 = form, 1 = results
  const [formStep, setFormStep] = useState(0); // 0, 1, 2 — which wizard screen within the form
  const [f, setF] = useState({
    name: "", company: "", email: "",
    ptype: "Rental (multifamily)", units: "", price: "", opening: "", presold: "", city: "",
  });
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

  const FORM_STEPS = ["Who you are", "What you're building", "The numbers"];
  const formStepReady = [
    f.name && f.company && f.email,
    f.city,
    f.units && f.price && f.opening && f.presold,
  ];

  const calc = useMemo(() => {
    const units = parseFloat(f.units) || 0;
    const price = parseFloat(f.price) || 0; // condo: price/unit · rental: rent/unit/mo
    const presold = parseFloat(f.presold) || 0;
    // Mixed-use projects are almost always leased on both sides — residential above,
    // commercial ground-floor below — not sold, so they run on the same rental math.
    const isRental = f.ptype.includes("Rental") || f.ptype.includes("Mixed");

    // ---- Headline "value at stake" ----
    // Rental  -> annual rent roll (rent × units × 12). No multiplier, no assumptions.
    // Condo   -> total sell-out value (price × units).
    const rentRoll = price * units * 12;
    const gross = isRental ? rentRoll : price * units;
    const grossBasis = isRental
      ? "Annual rent roll (rent × units × 12)"
      : "Total sellout value (price × units)";

    // monthsUntil is signed — split it into "runway left" and "time since opening"
    // rather than losing the sign, since which one applies changes the whole model below.
    const rawMonths = monthsUntil(f.opening);
    const runway = Math.max(0, rawMonths);
    const monthsSinceOpening = Math.max(0, -rawMonths);
    const noRunway = runway <= 0;
    const alreadyUnits = Math.round(units * (presold / 100));
    const vacantUnits = Math.max(0, units - alreadyUnits);

    // ---- Realistic pace: Slow / Steady / Hot ----
    // Base rates are calibrated to a ~60-unit project. Steady/Hot are intentionally trimmed
    // ~15-20% below the raw market-average figures — undershooting here is the safer bias for
    // a lead-gen tool: it keeps the "gap the Launch System closes" honest, and protects
    // credibility if a client compares the estimate to their actual results later. Slow is left
    // as the pessimistic floor.
    //   For-sale: slow ~1/mo, steady ~2.4/mo, hot ~5/mo.
    //   Rental:   lease-up is faster — slow ~8/mo, steady ~12/mo, hot ~18/mo.
    // Larger projects absorb somewhat faster (more marketing reach, more unit variety), but not
    // linearly — scale by sqrt(units/60), clamped to a sane band so a 12-unit build stays realistic
    // and a 300-unit tower doesn't blow up. Computed before the target so the target itself can be
    // grounded in what's actually achievable at a steady pace, not just an industry rule of thumb.
    const baseRates = isRental ? { slow: 8, steady: 12, hot: 18 } : { slow: 1, steady: 2.4, hot: 5 };
    const sizeFactor = units > 0 ? Math.min(2, Math.max(0.6, Math.sqrt(units / 60))) : 1;
    const rate = (r) => Math.max(1, Math.round(r * sizeFactor));
    const steadyRate = rate(baseRates.steady);

    // ---- Pre-sell target, OR post-opening lease-up target ----
    // Pre-opening: benchmarkTarget is the industry rule of thumb (50% pre-lease · 30%
    // pre-sale), and target is capped by what's realistically achievable at a steady
    // pace over the runway actually left — so a project with 2 months to opening isn't
    // handed the same goal as one with 12.
    // Post-opening: there's no more countdown to cap against, so that whole framing
    // stops applying — the only goal left is filling what's still vacant, in the
    // client's own time. benchmark/target collapse to 100% occupancy and achievableUnits
    // to the full building, which makes needUnits resolve to actual current vacancy
    // (units - alreadyUnits) instead of the pre-opening worst-case hypothetical.
    const benchmarkTarget = noRunway ? 1 : (isRental ? 0.5 : 0.3);
    // Pre-opening, reserves the same 1-month ramp-up the pace estimates below already pad
    // onto their timelines (scenarios.months = ceil(needUnits/rate) + 1) — without it, this
    // formula and that one model two different frictions for the same process and can
    // disagree: e.g. this could call 50% "achievable" inside a 1.5-month runway while the
    // padded pace estimate for the same units says it actually takes 3 months.
    const achievableUnits = noRunway
      ? units
      : (units > 0 ? Math.min(units, alreadyUnits + steadyRate * Math.max(0, runway - 1)) : 0);
    const achievablePct = units > 0 ? achievableUnits / units : 0;
    const target = Math.min(benchmarkTarget, achievablePct);
    const targetUnits = Math.ceil(units * target);
    const needUnits = Math.max(0, targetUnits - alreadyUnits);

    // Value secured at target (uses the headline basis, annualized rent for rentals)
    const perUnitValue = isRental ? price * 12 : price;
    const securedAtTarget = targetUnits * perUnitValue;

    const scenarios = [
      { key: "Slow", rate: rate(baseRates.slow), note: "soft market" },
      { key: "Steady", rate: steadyRate, note: "healthy market" },
      { key: "Hot", rate: rate(baseRates.hot), note: "high demand" },
    // +1 month pad on top of the raw division: leaves room for ramp-up (list approvals,
    // first showings, deposit paperwork) that a straight units/rate math doesn't account for.
    ].map((s) => ({ ...s, months: needUnits > 0 ? Math.ceil(needUnits / s.rate) + 1 : 0 }));

    // Carrying cost (rental: lost rent · condo: ~0.6%/mo financing drag). Pre-opening
    // this is a hypothetical worst case (what it'd cost to open with nothing leased, to
    // motivate acting beforehand) so it's sized to the whole building; post-opening it's
    // a real, ongoing cost, so it's sized to what's actually still vacant right now.
    const emptyCostMo = noRunway
      ? (isRental ? vacantUnits * price : vacantUnits * price * 0.006)
      : (isRental ? units * price : (price * units) * 0.006);

    // Generic sensitivity bands — "what would 10/20/30% vacancy cost on THIS building" —
    // independent of their actual current occupancy (that's emptyCostMo above). Gives a
    // benchmark to place their real number against, not just the one figure in isolation.
    const vacancyScenarios = [0.10, 0.20, 0.30].map((pct) => {
      const vUnits = Math.round(units * pct);
      return { pct, units: vUnits, costMo: isRental ? vUnits * price : vUnits * price * 0.006 };
    });

    return {
      units, price, presold, isRental,
      gross, grossBasis, rentRoll,
      monthsSinceOpening, vacantUnits, vacancyScenarios,
      runway, target, targetUnits, alreadyUnits, needUnits, securedAtTarget,
      noRunway, scenarios, emptyCostMo, perUnitValue, benchmarkTarget,
    };
  }, [f]);

  const ready = f.name && f.company && f.email && f.city && f.units && f.price && f.opening && f.presold;

  return (
    <div style={{ minHeight: "100vh", background: BRAND.paper, color: BRAND.ink, fontFamily: "'Poppins', Arial, sans-serif" }}>
      <style>{`
        * { box-sizing: border-box; }
        .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 80px; }
        .eyebrow { font-family: 'Poppins', Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; font-size: 12px; color: ${BRAND.muted}; font-weight: 600; }
        .h1 { font-family: 'Poppins', Arial, sans-serif; text-transform: uppercase; font-size: clamp(28px, 4.6vw, 46px); line-height: 1.1; letter-spacing: -.01em; margin: 10px 0 8px; font-weight: 800; }
        .sub { font-family: 'Poppins', Arial, sans-serif; color: ${BRAND.muted}; font-size: 15px; max-width: 560px; line-height: 1.5; }
        .card { background: #fff; border: 1px solid ${BRAND.line}; border-radius: 4px; padding: 26px; }
        label { display:block; font-family:'Poppins',Arial,sans-serif; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:${BRAND.ink2}; font-weight:700; margin-bottom:6px; }
        input, select { width:100%; padding:12px 14px; border:1px solid ${BRAND.line}; border-radius:3px; font-size:15px; font-family:'Poppins',Arial,sans-serif; background:#fff; color:${BRAND.ink}; }
        input:focus, select:focus { outline:2px solid ${BRAND.ink}; outline-offset:0; border-color:${BRAND.ink}; }
        .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; }
        .grid3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; }
        .ppFrame { width:100%; height:650px; border:none; display:block; }
        @media(max-width:640px){ .ppFrame{ height:1000px; } }
        .btn { font-family:'Poppins',Arial,sans-serif; font-weight:700; letter-spacing:.04em; text-transform: uppercase; border:none; border-radius:3px; padding:15px 26px; font-size:13px; cursor:pointer; transition: background .15s ease, color .15s ease; }
        .btnPrimary { background:${BRAND.ink}; color:#fff; }
        .btnPrimary:hover { background:${BRAND.accentDeep}; }
        .btnGhost { background:transparent; color:${BRAND.ink}; border:1px solid ${BRAND.ink}; }
        .btnGhost:hover { background:${BRAND.ink}; color:#fff; }

        .ppTag { font-family:'Poppins',Arial,sans-serif; letter-spacing:.24em; text-transform:uppercase; font-size:10px; color:${BRAND.onDarkMuted}; font-weight:700; }

        .csFan { position:relative; height:300px; margin:32px 0 20px; }
        .csCard { position:absolute; top:0; left:50%; border-radius:8px; overflow:hidden; box-shadow:0 14px 30px rgba(0,0,0,0.22); background:#000; }
        .csCard img { width:100%; object-fit:cover; display:block; }
        .csCard-0, .csCard-2 { width:250px; opacity:.94; }
        .csCard-0 img, .csCard-2 img { height:190px; }
        .csCard-1 { width:310px; z-index:3; }
        .csCard-1 img { height:235px; }
        .csCard-0 { top:18px; z-index:1; transform:translateX(-50%) translateX(-265px) rotate(-6deg); }
        .csCard-2 { top:18px; z-index:2; transform:translateX(-50%) translateX(265px) rotate(6deg); }
        .csCard-1 { transform:translateX(-50%); }
        .csOverlay { position:absolute; left:0; right:0; bottom:0; padding:12px 12px 10px; background:linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0)); }
        .csLabel { font-family:'Poppins',Arial,sans-serif; text-transform:uppercase; font-size:8.5px; font-weight:800; letter-spacing:.14em; color:#fff; opacity:.85; margin-bottom:4px; }
        .csStat { font-family:'Poppins',Arial,sans-serif; text-transform:uppercase; font-size:13px; font-weight:800; color:#fff; line-height:1.25; }
        .csValue { font-family:'Poppins',Arial,sans-serif; font-size:11.5px; font-weight:700; color:#fff; margin-top:3px; }
        @media (max-width:640px) {
          .csFan { height:255px; margin:22px 0 14px; }
          .csCard-0, .csCard-2 { width:165px !important; }
          .csCard-0 img, .csCard-2 img { height:150px !important; }
          .csCard-1 { width:215px !important; }
          .csCard-1 img { height:196px !important; }
          .csCard-0 { transform:translateX(-50%) translateX(-98px) rotate(-6deg) !important; }
          .csCard-2 { transform:translateX(-50%) translateX(98px) rotate(6deg) !important; }
          .csCard-1 { transform:translateX(-50%) !important; }
          .csOverlay { padding:10px 10px 8px; }
          .csLabel { font-size:7.5px; margin-bottom:3px; }
          .csStat { font-size:11px; line-height:1.2; }
          .csValue { font-size:9.5px; margin-top:2px; }
        }

        .wizLabel { font-family:'Poppins',Arial,sans-serif; font-size:13px; font-weight:800; letter-spacing:.04em; color:${BRAND.ink}; margin-bottom:10px; }
        .wizProgress { display:flex; gap:6px; margin-bottom:18px; }
        .wizSeg { flex:1; height:4px; border-radius:2px; background:${BRAND.line}; }
        .wizSeg.active { background:${BRAND.ink}; }
      `}</style>

      <div className="wrap">
        <img src="./rez3d-logo.png" alt="Rez 3D" style={{ height: 32, display: "block", marginBottom: 4 }} />
        <h1 className="h1">The Vacancy Cost Calculator</h1>
        <p className="sub">See what empty units could cost you, and what to have in place to start leasing before opening day.</p>

        {step === 0 && <CaseStudyFan />}

        {step === 0 && (
          <div className="card" style={{ marginTop: 26 }}>
            <div className="wizProgress">
              {FORM_STEPS.map((_, i) => <div key={i} className={`wizSeg ${i <= formStep ? "active" : ""}`} />)}
            </div>
            <div className="wizLabel">Step {formStep + 1} of {FORM_STEPS.length} · {FORM_STEPS[formStep]}</div>

            {formStep === 0 && (
              <div className="grid3">
                <div><label>Your name</label><input value={f.name} onChange={set("name")} placeholder="Jordan Smith" /></div>
                <div><label>Company</label><input value={f.company} onChange={set("company")} placeholder="Developments Inc." /></div>
                <div><label>Email</label><input value={f.email} onChange={set("email")} placeholder="you@company.com" /></div>
              </div>
            )}

            {formStep === 1 && (
              <div className="grid2">
                <div>
                  <label>Project type</label>
                  <select value={f.ptype} onChange={set("ptype")}>
                    <option>Condo (for sale)</option>
                    <option>Rental (multifamily)</option>
                    <option>Mixed-use</option>
                  </select>
                </div>
                <div><label>City / market</label><input value={f.city} onChange={set("city")} placeholder="City, Province" /></div>
              </div>
            )}

            {formStep === 2 && (
              <>
                <div className="grid3" style={{ marginBottom: 16 }}>
                  <div><label>Number of units</label><input value={f.units} onChange={set("units")} inputMode="numeric" placeholder="60" /></div>
                  <div>
                    <label>{calc.isRental ? "Rent / unit / mo" : "Price / unit"}</label>
                    <input value={f.price} onChange={set("price")} inputMode="numeric" placeholder={calc.isRental ? "1900" : "425000"} />
                  </div>
                  <div><label>Opening (month)</label><input value={f.opening} onChange={set("opening")} type="month" /></div>
                </div>
                <div className="grid2">
                  <div><label>Already pre-sold / leased (%)</label><input value={f.presold} onChange={set("presold")} inputMode="numeric" placeholder="0" /></div>
                </div>
              </>
            )}

            <div style={{ marginTop: 24, display: "flex", gap: 12, alignItems: "center" }}>
              {formStep > 0 && (
                <button className="btn btnGhost" onClick={() => setFormStep(formStep - 1)}>← Back</button>
              )}
              {formStep < FORM_STEPS.length - 1 && (
                <button className="btn btnPrimary" disabled={!formStepReady[formStep]} style={{ opacity: formStepReady[formStep] ? 1 : 0.45, cursor: formStepReady[formStep] ? "pointer" : "not-allowed" }} onClick={() => setFormStep(formStep + 1)}>
                  Next →
                </button>
              )}
              {formStep === FORM_STEPS.length - 1 && (
                <>
                  <button className="btn btnPrimary" disabled={!ready} style={{ opacity: ready ? 1 : 0.45, cursor: ready ? "pointer" : "not-allowed" }} onClick={() => { notifyLead(f, calc); setStep(1); }}>
                    Calculate My Vacancy Cost →
                  </button>
                  <span style={{ fontFamily: "'Poppins',Arial,sans-serif", fontSize: 12, color: BRAND.muted }}>Takes 30 seconds. No obligation.</span>
                </>
              )}
            </div>
          </div>
        )}

        {step === 1 && <Results f={f} calc={calc} onBack={() => setStep(0)} />}
      </div>
    </div>
  );
}

function Results({ f, calc, onBack }) {
  const [pdfState, setPdfState] = useState("idle");
  const roadmapTitle = `Your ${money(calc.gross)} ${calc.isRental ? "Pre-Leasing" : "Pre-Selling"} Plan`;

  // Reveal the results scrolled to the constraint tables (the payoff), not wherever the
  // page happened to be scrolled to on the form — the client can scroll up for the hero
  // or down for the roadmap from there.
  const topRef = useRef(null);
  useEffect(() => {
    topRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
  }, []);

  async function downloadPDF() {
    setPdfState("working");
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "pt", format: "letter" });
      const W = doc.internal.pageSize.getWidth();
      const M = 54;
      const hex = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
      // Brand is monochrome (matches rez3drenders.ca): ink/muted/line for light backgrounds,
      // onDark/onDarkMuted for text and fills placed on the ink-colored dark panels.
      const ink = hex(BRAND.ink), muted = hex(BRAND.muted), line = hex(BRAND.line);
      const onDark = hex(BRAND.onDark), onDarkMuted = hex(BRAND.onDarkMuted);
      const faint = [170, 170, 170];
      // Matches the on-screen KV_TONES (#FBEEEC/#B23A2E/#8C2C22 and #EBF6F0/#2F7D5B/#215C43):
      // "pain" flags the cost of waiting, "good" flags the payoff, on the one stat card
      // per row that's meant to be the emotional point, not just another neutral number.
      const TONE_PDF = {
        pain: { bg: [251, 238, 236], border: [178, 58, 46], text: [140, 44, 34] },
        good: { bg: [235, 246, 240], border: [47, 125, 91], text: [33, 92, 67] },
      };

      try { await ensurePoppinsFont(doc); } catch (e) { /* falls back to jsPDF's built-in Helvetica */ }

      // Content flows top-down on a single letter page (612 x 792pt) wherever it fits;
      // the footer band is placed right after the roadmap and only spills to a second
      // page if there genuinely isn't room, so this stays robust as content changes.
      const PAGE_H = doc.internal.pageSize.getHeight();

      // Hero render, cropped to a banner strip, with the pre-sold hook overlaid
      const IMG_H = 96;
      let heroDataUrl = null;
      try { heroDataUrl = await loadCoverImage("./02.jpg", W * 2, IMG_H * 2, 0.55); } catch (e) { heroDataUrl = null; }
      if (heroDataUrl) {
        doc.addImage(heroDataUrl, "JPEG", 0, 0, W, IMG_H);
        doc.setFillColor(0, 0, 0); doc.rect(0, IMG_H - 26, W, 26, "F");
        doc.setTextColor(...onDark); doc.setFont("Poppins", "bold"); doc.setFontSize(13);
        doc.text("70% PRE-LEASED BEFORE OPENING", M, IMG_H - 9);
      }
      const coverY = heroDataUrl ? IMG_H : 0;

      // Cover band
      doc.setFillColor(...ink); doc.rect(0, coverY, W, 90, "F");
      let logoDataUrl = null;
      try { logoDataUrl = await loadPngImage("./rez3d-logo-white.png", 72); } catch (e) { logoDataUrl = null; }
      if (logoDataUrl) {
        doc.addImage(logoDataUrl, "PNG", M, coverY + 6, 18, 18);
      } else {
        doc.setTextColor(...onDark); doc.setFont("Poppins", "bold"); doc.setFontSize(8);
        doc.text("REZ 3D · DEVELOPER TOOL", M, coverY + 20);
      }
      doc.setTextColor(...onDark); doc.setFont("Poppins", "bold"); doc.setFontSize(18);
      doc.text("The Vacancy Cost Calculator", M, coverY + 43);
      doc.setFont("Poppins", "normal"); doc.setFontSize(9); doc.setTextColor(...onDarkMuted);
      doc.text("Find out what waiting to lease could cost you, then get your plan to start earlier.", M, coverY + 58);
      doc.setFont("Poppins", "normal"); doc.setFontSize(8); doc.setTextColor(...onDarkMuted);
      doc.text(`Prepared for ${f.name}${f.company ? " · " + f.company : ""}`, M, coverY + 77);

      let y = coverY + 104;

      const colGap = 10;
      const cardH = 52;
      const colW = (W - M * 2 - colGap * 2) / 3;
      // One row of 3 stat cards, one of which (tone: "pain" or "good") is drawn in color
      // as the emotional point of that row — mirrors the on-screen KVTable highlight.
      function statCard(x, yy, value, valueLabel, sub, tone) {
        const t = tone ? TONE_PDF[tone] : null;
        doc.setDrawColor(...(t ? t.border : line));
        doc.setFillColor(...(t ? t.bg : [255, 255, 255]));
        doc.roundedRect(x, yy, colW, cardH, 3, 3, "FD");
        doc.setTextColor(...(t ? t.text : ink)); doc.setFont("Poppins", "bold"); doc.setFontSize(t ? 15 : 13);
        doc.text(String(value), x + 10, yy + 19);
        doc.setTextColor(...(t ? t.text : muted)); doc.setFont("Poppins", "bold"); doc.setFontSize(6.5);
        doc.text(String(valueLabel).toUpperCase(), x + 10, yy + 31, { maxWidth: colW - 18 });
        if (sub) {
          doc.setFont("Poppins", "normal"); doc.setFontSize(6);
          doc.setTextColor(...(t ? t.text : faint));
          doc.text(String(sub), x + 10, yy + 42, { maxWidth: colW - 18 });
        }
      }

      // ---- Your Vacancy Cost ----
      doc.setTextColor(...ink); doc.setFont("Poppins", "bold"); doc.setFontSize(11.5);
      doc.text(`Your vacancy cost${f.city ? ", " + f.city : ""}`, M, y);
      y += 6; doc.setDrawColor(...line); doc.line(M, y, W - M, y); y += 13;

      // Row 1: generic 10/20/30% sensitivity bands, independent of their actual occupancy.
      calc.vacancyScenarios.forEach((s, i) => {
        statCard(M + i * (colW + colGap), y, `${money(s.costMo)}/mo`, `${Math.round(s.pct * 100)}% vacant`, `${s.units} of ${calc.units} units`, null);
      });
      y += cardH + 8;

      // Row 2: their actual current cost, plus what a slower lease-up would add to it.
      const costStats = [
        [`${money(calc.emptyCostMo)}/mo`, calc.isRental ? "Monthly lost rent" : "Monthly carrying cost", calc.noRunway ? `${calc.vacantUnits} vacant units sitting empty` : "If you open with zero units leased", "pain"],
        [money(calc.emptyCostMo * 3), calc.isRental ? "Cost of a 3-mo slower lease-up" : "Cost of a 3-mo slower sell-out", "If it takes 3 months longer than planned", null],
        [money(calc.emptyCostMo * 6), calc.isRental ? "Cost of a 6-mo slower lease-up" : "Cost of a 6-mo slower sell-out", "If it takes 6 months longer than planned", null],
      ];
      costStats.forEach((s, i) => statCard(M + i * (colW + colGap), y, s[0], s[1], s[2], s[3]));
      y += cardH + 18;

      // ---- Your Lease-Up Potential ----
      doc.setTextColor(...ink); doc.setFont("Poppins", "bold"); doc.setFontSize(11.5);
      doc.text("Your lease-up potential", M, y);
      y += 6; doc.setDrawColor(...line); doc.line(M, y, W - M, y); y += 13;

      const runwayValue = calc.needUnits > 0 ? `${steady.months} mo` : (aheadOfBenchmark ? "Ahead of pace" : "No runway left");
      const runwaySub = calc.needUnits > 0
        ? `Slow: ${slow.months} mo · Hot: ${hot.months} mo`
        : (aheadOfBenchmark ? "Already past benchmark" : `${calc.vacantUnits} unit${calc.vacantUnits === 1 ? "" : "s"} still ${calc.isRental ? "unleased" : "unsold"}`);
      const potentialStats = [
        [`${slow.rate}–${hot.rate} units/mo`, "Expected leasing pace", `Typically ~${steady.rate}/mo at a steady pace`, null],
        [runwayValue, "Runway to full (estimated)", runwaySub, null],
        [
          money(calc.gross),
          calc.isRental ? "Annual rent roll at full occupancy" : "Total value at full sell-out",
          calc.isRental ? "Once every unit is leased" : "Once every unit is sold",
          "good",
        ],
      ];
      potentialStats.forEach((s, i) => statCard(M + i * (colW + colGap), y, s[0], s[1], s[2], s[3]));
      y += cardH + 15;

      // Roadmap — titles only, no descriptions, to keep this to one page
      doc.setTextColor(...ink); doc.setFont("Poppins", "bold"); doc.setFontSize(11.5);
      doc.text(roadmapTitle, M, y); y += 5;
      doc.setDrawColor(...line); doc.line(M, y, W - M, y); y += 13;

      PHASES.forEach((ph) => {
        doc.setTextColor(...ink); doc.setFont("Poppins", "bold"); doc.setFontSize(7.5);
        const phaseLabel = ph.phase.toUpperCase() + ": " + ph.title.toUpperCase();
        doc.text(phaseLabel, M, y);
        const labelW = doc.getTextWidth(phaseLabel);
        doc.setTextColor(...muted); doc.setFont("Poppins", "normal"); doc.setFontSize(7.5);
        doc.text(`${ph.weeks} · ${ph.tagline}`, M + labelW + 6, y);
        y += 13;
        ph.steps.forEach((s) => {
          doc.setTextColor(...ink); doc.setFont("Poppins", "bold"); doc.setFontSize(8.5); doc.text(s.n, M, y);
          doc.setFont("Poppins", "bold"); doc.setFontSize(9.5); doc.text(s.t, M + 22, y);
          const spec = typeof s.spec === "function" ? s.spec(calc) : s.spec;
          doc.setFont("Poppins", "normal"); doc.setFontSize(7.5); doc.setTextColor(...muted);
          doc.text(spec, W - M, y, { align: "right" });
          y += 11.5;
        });
        y += 4;
      });
      doc.setTextColor(...ink); doc.setFont("Poppins", "bold"); doc.setFontSize(8.5);
      doc.text(`That's the full recipe: ${TOTAL_DELIVERABLES} deliverables, in order.`, M, y);
      y += 10;

      // Footer — flows right after the roadmap as a compact band when there's room.
      // If it wouldn't fit, it becomes a proper full-bleed closing page instead of an
      // awkward sliver at the top of an otherwise-empty page.
      const COMPACT_FOOTER_H = 108;
      y += 6;
      const onOwnPage = y + COMPACT_FOOTER_H > PAGE_H - 30;
      if (onOwnPage) { doc.addPage(); y = 0; }
      const footerTop = y;
      const footerH = onOwnPage ? PAGE_H : COMPACT_FOOTER_H;
      doc.setFillColor(...ink); doc.rect(0, footerTop, W, footerH, "F");
      let fy = footerTop + (onOwnPage ? 150 : 18);
      doc.setTextColor(...onDark); doc.setFont("Poppins", "bold"); doc.setFontSize(onOwnPage ? 9 : 7.5);
      doc.text("WHY REZ 3D", M, fy); fy += onOwnPage ? 26 : 15;
      doc.setTextColor(...onDark); doc.setFont("Poppins", "bold"); doc.setFontSize(onOwnPage ? 22 : 13);
      doc.text("We build what makes it sell.", M, fy); fy += onOwnPage ? 30 : 14;
      doc.setTextColor(...onDarkMuted); doc.setFont("Poppins", "normal"); doc.setFontSize(onOwnPage ? 10.5 : 7);
      const blurb = doc.splitTextToSize(
        "Renders, launch website and plan selector that turn your project into a qualified waitlist before you break ground. We build the assets. We don't sell your units, so no commission and you keep full control of your sales and margins.",
        onOwnPage ? W - M * 2 - 80 : W - M * 2
      );
      doc.text(blurb, M, fy); fy += blurb.length * (onOwnPage ? 15 : 9) + (onOwnPage ? 30 : 8);
      doc.setTextColor(...onDark); doc.setFont("Poppins", "bold"); doc.setFontSize(onOwnPage ? 12 : 8.5);
      doc.text("Reach out to scope your project at rez3drenders.ca", M, fy); fy += onOwnPage ? 18 : 11;
      doc.setTextColor(...onDarkMuted); doc.setFont("Poppins", "normal"); doc.setFontSize(onOwnPage ? 8.5 : 6.5);
      doc.text("Stephane LeBlanc · Rez 3D Renders Inc. · Powered by Planpoint", M, fy);

      doc.save(`Vacancy-Cost-Calculator-${(f.company || f.name).replace(/\s+/g, "-")}.pdf`);
      setPdfState("done");
    } catch (e) {
      console.error(e);
      setPdfState("error");
    }
  }

  const [slow, steady, hot] = calc.scenarios;
  // needUnits can hit 0 two very different ways: already past the pre-leasing benchmark
  // (genuinely ahead), or opening is so close there's no runway left to make progress
  // toward it (genuinely behind) — same number, opposite story, so they need different copy.
  const aheadOfBenchmark = calc.alreadyUnits >= calc.units * calc.benchmarkTarget;

  return (
    <div style={{ marginTop: 26 }} ref={topRef}>

      {/* ===================== SECTION 1: YOUR VACANCY COST ===================== */}
      <SectionLabel sub="What empty units are costing you, today and if lease-up runs long.">Your Vacancy Cost</SectionLabel>

      <FitWidth>
        <div style={{ width: 760 }}>
          <div className="grid3" style={{ marginTop: 16 }}>
            {calc.vacancyScenarios.map((s) => (
              <div key={s.pct} style={{ background: "#fff", border: `2px solid ${BRAND.ink}`, borderRadius: 4, padding: "16px 14px", textAlign: "center" }}>
                <div style={{ fontFamily: "'Poppins',Arial,sans-serif", fontSize: 11, fontWeight: 800, letterSpacing: ".08em", textTransform: "uppercase", color: BRAND.muted }}>
                  {Math.round(s.pct * 100)}% Vacant
                </div>
                <div style={{ fontFamily: "'Poppins',Arial,sans-serif", fontWeight: 800, fontSize: 22, color: BRAND.ink, margin: "6px 0 2px" }}>
                  {money(s.costMo)}/mo
                </div>
                <div style={{ fontFamily: "'Poppins',Arial,sans-serif", fontSize: 11, color: BRAND.muted }}>
                  {s.units} of {calc.units} units
                </div>
              </div>
            ))}
          </div>

          <KVTable
            rows={[
              {
                label: calc.isRental ? "Monthly Lost Rent" : "Monthly Carrying Cost",
                value: `${money(calc.emptyCostMo)}/mo`,
                sub: calc.noRunway
                  ? (calc.isRental ? `Rent lost every month your ${calc.vacantUnits} vacant unit${calc.vacantUnits === 1 ? "" : "s"} sit empty` : `Financing drag every month your ${calc.vacantUnits} unsold unit${calc.vacantUnits === 1 ? "" : "s"} sit`)
                  : (calc.isRental ? "Total rent lost per month if you open with zero units pre-leased" : "Total financing cost per month if you open with zero units pre-sold"),
                highlight: "pain",
              },
              {
                label: calc.isRental ? "Cost of a 3-Month Slower Lease-Up" : "Cost of a 3-Month Slower Sell-Out",
                value: money(calc.emptyCostMo * 3),
                sub: "If it takes 3 months longer than planned",
              },
              {
                label: calc.isRental ? "Cost of a 6-Month Slower Lease-Up" : "Cost of a 6-Month Slower Sell-Out",
                value: money(calc.emptyCostMo * 6),
                sub: "If it takes 6 months longer than planned",
              },
            ]}
          />
        </div>
      </FitWidth>

      {/* ===================== SECTION 2: YOUR PRE-LEASING PLAN ===================== */}
      <SectionLabel sub="What needs to be in place before opening day, and when to build it.">Your Pre-Leasing Plan</SectionLabel>

      <h2 style={{ fontSize: 24, fontWeight: 700, margin: "10px 0 6px", fontFamily: "'Poppins', Arial, sans-serif", textAlign: "center" }}>{roadmapTitle}</h2>
      <p style={{ fontFamily: "'Poppins',Arial,sans-serif", fontSize: 14, color: BRAND.muted, marginTop: 0, marginBottom: 4, textAlign: "center" }}>
        {calc.needUnits > 0 ? (
          <>Fill your remaining units at <b style={{ color: BRAND.ink }}>{slow.rate}–{hot.rate}/mo</b>, reaching full occupancy in <b style={{ color: BRAND.ink }}>~{steady.months} mo</b>, worth <b style={{ color: BRAND.ink }}>{money(calc.gross)}</b> in {calc.isRental ? "annual rent" : "total sales"}.</>
        ) : aheadOfBenchmark ? (
          <>You're already ahead of pace on pre-{calc.isRental ? "leasing" : "selling"}, worth <b style={{ color: BRAND.ink }}>{money(calc.gross)}</b> in {calc.isRental ? "annual rent" : "total sales"} once every unit is {calc.isRental ? "leased" : "sold"}.</>
        ) : (
          <>Opening is close with <b style={{ color: BRAND.ink }}>{calc.vacantUnits} unit{calc.vacantUnits === 1 ? "" : "s"}</b> still {calc.isRental ? "unleased" : "unsold"} — there's barely any runway left to hit a pre-{calc.isRental ? "leasing" : "selling"} benchmark, worth <b style={{ color: BRAND.ink }}>{money(calc.gross)}</b> in {calc.isRental ? "annual rent" : "total sales"} once it's full.</>
        )}
      </p>
      <PreLeasingPlan phases={PHASES} calc={calc} />

      <LeasingToolDemo calc={calc} />

      <div className="planpoint">
        <div className="ppTag">Why Rez 3D</div>
        <h3 style={{ fontSize: 24, fontWeight: 700, margin: "10px 0 12px", fontFamily: "'Poppins', Arial, sans-serif" }}>We build what makes it sell</h3>
        <p style={{ fontFamily: "'Poppins',Arial,sans-serif", fontSize: 15, lineHeight: 1.6, color: BRAND.onDarkMuted, margin: 0 }}>
          We build the renders, launch system, and <b style={{ color: BRAND.onDark }}>plan selector</b> that turn demand into a qualified waitlist. No commission. You keep full control of your sales and margins.
        </p>
      </div>

      <div style={{ display: "flex", gap: 12, marginTop: 26, flexWrap: "wrap" }}>
        <button className="btn btnPrimary" onClick={downloadPDF}>

// Renders children at their natural (desktop) width, then scales the whole block down
// uniformly to fit whatever width it's given — so mobile shows the exact same layout and
// line-wrapping as desktop, just smaller, instead of the browser reflowing text into a
// denser, more cramped shape at narrow widths.
function FitWidth({ children }) {
  const outerRef = useRef(null);
  const innerRef = useRef(null);
  const [scale, setScale] = useState(1);
  const [height, setHeight] = useState(undefined);
  const [offset, setOffset] = useState(0);

  useLayoutEffect(() => {
    function recalc() {
      if (!outerRef.current || !innerRef.current) return;
      const outerW = outerRef.current.clientWidth;
      const naturalW = innerRef.current.offsetWidth;
      const naturalH = innerRef.current.offsetHeight;
      const s = naturalW > outerW ? outerW / naturalW : 1;
      setScale(s);
      setHeight(naturalH * s);
      // Centers the block when it's narrower than the container (desktop, s === 1).
      // When it's being scaled down to fit (mobile, s < 1) this always resolves to 0,
      // since the scaled width already equals outerW exactly — no offset needed.
      setOffset(Math.max(0, (outerW - naturalW * s) / 2));
    }
    recalc();
    window.addEventListener("resize", recalc);
    return () => window.removeEventListener("resize", recalc);
  }, [children]);

  return (
    <div ref={outerRef} style={{ width: "100%", height, overflow: "hidden" }}>
      <div ref={innerRef} style={{ display: "inline-block", marginLeft: offset, transform: `scale(${scale})`, transformOrigin: "top left" }}>
        {children}
      </div>
    </div>
  );
}
